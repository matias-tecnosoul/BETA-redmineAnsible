server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

# 🎯 CONFIGURACIÓN MÍNIMA DEL METRICS GENERATOR
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  
  traces_storage:
    path: /var/tempo/generator/traces
  
  processor:
    service_graphs:
      histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]
      dimensions: ["service.name", "http.method", "http.status_code"]
    
    span_metrics:
      histogram_buckets: [0.002, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
      dimensions: ["service.name", "http.method", "http.status_code"]

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# ✨ CONFIGURACIÓN PARA HABILITAR METRICS GENERATOR
overrides:
  defaults:
    metrics_generator:
      processors: ["service-graphs", "span-metrics"]
