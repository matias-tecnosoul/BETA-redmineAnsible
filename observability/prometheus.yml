global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Habilitar exemplars
  external_labels:
    cluster: 'docker-compose'
    replica: 'prometheus-1'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
    scrape_interval: 15s
    metrics_path: /metrics
