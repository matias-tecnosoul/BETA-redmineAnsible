# Usuarios y rutas (mantener como está)
redmine_user: redmine
redmine_group: redmine
vagrant_user: vagrant
vagrant_home: /home/vagrant
redmine_version: 6.0.5
redmine_root: /opt/redmine

# Base de datos (mantener como está)
mysql_root_password: "rootpass123"
mysql_user: "redmine"
mysql_password: "redmine123"
mysql_server: "localhost"

mysql_databases:
  - name: redmine
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci

mysql_users:
  - name: redmine
    host: localhost
    password: redmine123
    priv: "redmine.*:ALL"

# asdf (mantener como está)
asdf_user: redmine
asdf_group: redmine
asdf_dir: /home/redmine/.asdf
asdf_plugins:
  - name: ruby
    versions: ["3.2.0"]
    global: "3.2.0"
asdf_legacy_version_file: "yes"

# OpenTelemetry Collector - Configuración YAML cruda (como espera el role)
otel_collector_version: "0.113.0"
otel_collector_type: "contrib"

# IMPORTANTE: El role espera YAML como string, no como diccionario
otel_collector_config: |
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  
  processors:
    batch:
  
  exporters:
    otlphttp:
      endpoint: "{{ grafana_cloud_otlp_endpoint }}"
      headers:
        Authorization: "Basic {{ grafana_cloud_otlp_token }}"
  
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp]

# nginx (mantener configuración existente)
nginx_remove_default_vhost: true

nginx_vhosts:
  - listen: "80"
    server_name: "mikroways.redmine www.mikroways.redmine"
    root: "/opt/redmine/public"
    index: "index.html index.htm"
    extra_parameters: |
      location /assets/ {
          expires max;
          access_log off;
      }
      
      location / {
          proxy_pass http://localhost:3001;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }